<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>svg描边动画效果</title>
    <!-- stroke-dashoffset用于调整虚线模式的起始偏移量。
  增大stroke-dashoffset，让虚线模式向路径起点移动，视觉上像线条被“擦除” -->
    <!-- 绘制动画（“画笔”效果）总结：
  最经典的应用：
  通过动画逐渐减小stroke-dashoffset，让虚线模式“逆向移动”，视觉上像画笔沿着路径绘制线条。
  实现步骤：
  1.计算路径总长度L（通过getTotalLength()）。
  2. 设置 stroke-dasharray: ;
  3.初始stroke-dashoffset: ;（实线段完全隐藏）。
  4.动画中逐渐将offset减小到0，实线段逐渐覆盖整个路径。 -->
    <style>
      svg {
        fill: none;
        stroke: red;
        stroke-width: 5px;
        stroke-dasharray: 2783; /* 路径总长度 */
        stroke-dashoffset: 2783; /* 初始偏移量，实线段完全隐藏 */
        animation: draw 3s linear infinite;
      }
      @keyframes draw {
        0% {
          stroke-dashoffset: 2783;
        }
        100% {
          stroke-dashoffset: 0;
        }
      }
    </style>
  </head>

  <body>
    <svg
      class="heart"
      t="1754555014655"
      class="icon"
      viewBox="0 0 1024 1024"
      version="1.1"
      xmlns="http://www.w3.org/2000/svg"
      p-id="6244"
      xmlns:xlink="http://www.w3.org/1999/xlink"
      width="200"
      height="200"
    >
      <path
        id="heart"
        d="M32 407.584a279.584 279.584 0 0 1 480-194.944 279.584 279.584 0 0 1 480 194.944 278.144 278.144 0 0 1-113.024 224.512L562.592 892.8a96 96 0 0 1-124.416-1.952l-308.16-270.688A278.976 278.976 0 0 1 32 407.584z"
        p-id="6245"
      ></path>
    </svg>
  </body>
</html>
