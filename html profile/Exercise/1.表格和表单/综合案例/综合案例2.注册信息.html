<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>注册信息</h2>
    <form action="">
        <table>
            <h3>个人信息</h3>   
            <tr>
                <td>姓名:</td>
                <td><input type="text" placeholder="请输入真实姓名"></td>
            </tr>
            <tr>
                <td>密码:</td>
                <td><input type="password" placeholder="请输入密码"></td>
            </tr>
            <tr>
                <td>确认密码:</td>
                <td><input type="password" placeholder="请输入确认密码"></td>
            </tr>
            <tr>
                <td>性别:</td>
                <td><input type="radio" name="1">男<input type="radio" name="1">女</td>
            </tr>
            <tr>
                <td>居住城市:</td>
                <td><select name="" id="">
                    <option value="">北京</option>
                    <option value="">上海</option>                 
                    <option value="">广州</option>
                    <option value="">深圳</option>
                    <option value="">武汉</option>
                </select></td>
            </tr>
        </table>
        <h2>教育经历</h2>
        <table>
            <tr>
                <td>最高学历:</td>
                <td><select name="" id="">
                    <option value="">专科</option>                   
                    <option value="">本科</option>
                    <option value="">研究生</option>
                </select></td>
            </tr>
            <tr>
                <td>学校名称:</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>所学专业:</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>在校时间:</td>
                <td>
                    <select name="" id="">
                    <option value="">2020</option>
                    <option value="">2021</option>
                    <option value="">2022</option>
                    <option value="">2023</option>
                    <option value="">2024</option>
                    <option value="">2025</option>
                    </select>
                    --
                    <select>
                    <option value="">2022</option>
                    <option value="">2023</option>
                    <option value="">2024</option>
                    <option value="">2025</option>
                    <option value="">2026</option>
                    <option value="">2027</option>
                    <option value="">2028</option>
                    <option value="">2029</option>
                    </select>
                </td>
            </tr>
        </table>
        <h2>工作经历</h2>
        公司名称:<input type="text"><br>
        工作概述:<br>
        <textarea></textarea><br>
        <input type="checkbox">已阅读以下协议:
        <ul>
            <li>
                <a href="https://www.baidu.com" target="_blank">《用户服务协议》</a>
            </li>
            <li>
                <a href="https://www.tencent.com" target="_blank">《隐私政策》</a>
            </li>
        </ul>
        <button type="button">免费注册</button>
        <button type="reset">重新编写</button>
    </form>
</body>
</html>
