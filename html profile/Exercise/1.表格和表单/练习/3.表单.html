<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- form表单区域 -->
    <form>
      用户名
      <input type="text" placeholder="请输入用户名" /><br /><br />
      密码
      <input type="password" placeholder="请输入密码" /><br /><br />
      性别：
      <input type="radio" name="1" checked />男
      <input type="radio" name="1" />女<br /><br />
      <input type="checkbox" />我要上211研究生
      <input type="checkbox" checked />我要学前端
      <input type="checkbox" checked />我要学后端<br /><br />
      文件
      <input type="file" /><br /><br />
      多选文件
      <input type="file" multiple /><br /><br />
      城市：
      <select>
        <option>北京</option>
        <option selected>上海</option>
        <option>广州</option>
        <option>深圳</option>
        <option>黄石</option>
      </select>
      <br /><br />
      <textarea>善于结良缘，恶语伤人寒！</textarea>
      <br /><br />
      性别：
      <input type="radio" name="gender" id="man" /><label for="man">男</label>
      <label><input type="radio" name="gender" id="woman" />女</label>
      <br /><br />
      <button type="submit">提交</button>
      <button type="reset">重置</button>
      <button type="button">普通</button>
    </form>
  </body>
</html>
