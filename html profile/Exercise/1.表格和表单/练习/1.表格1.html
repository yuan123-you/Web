<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 简单的表格 -->
    <!-- table:表示一个表格 -->
    <!-- tr:表示表格里的行 -->
    <!-- 快速生成三行三列的表格 table>tr*3>td*3 -->
    <table
      border="2"
      cellspacing="0"
      width="900"
      height="600"
      bordercolor="yellow"
      bgcolor="skyblue"
      align="center"
    >
      <tr align="center">
        <td>1</td>
        <td>2</td>
        <td>3</td>
      </tr>
      <tr align="center">
        <td>4</td>
        <td align="center">5</td>
        <td>6</td>
      </tr>
      <tr align="center">
        <td>7</td>
        <td>8</td>
        <td>9</td>
      </tr>
    </table>
    <table
      border="2"
      cellspacing="0"
      width="900"
      height="600"
      bordercolor="yellow"
      bgcolor="skyblue"
      align="center"
    >
      <tr align="center">
        <td>01</td>
        <td>张三</td>
        <td>Chinese</td>
        <td>90</td>
      </tr>
      <tr align="center">
        <td>02</td>
        <td>李四</td>
        <td>English</td>
        <td>85</td>
      </tr>
      <tr align="center">
        <td>03</td>
        <td>王五</td>
        <td>math</td>
        <td>95</td>
      </tr>
    </table>
  </body>
</html>
