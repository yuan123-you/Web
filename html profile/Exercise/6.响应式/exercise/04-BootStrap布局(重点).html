<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BootStrap布局(重点)</title>
    <link rel="stylesheet" href="./bootstrap/bootstrap.min.css" />
    <!-- 4.布局（Layout)
  Bootstrap布局是我们学习的重点，重点学习里面的网格系统（栅格系统）
  需要学习断点、容器、栅格系统、列等相关内容。 -->
    <!-- 4.1断点：
  断点（Breakpoints）时响应式设计的组成部分。通过断点可以控制何
  时可以在特定视口（viewport）或设备尺寸下调整布局。 -->
    <!-- 4.2 容器:
  容器是Bootstrap中最基本的布局元素，在使用我们的默认网格系统时是必需的。容器用于将其中的内容居中。
  包含：默认容器（container）、响应式容器（Responsive containers）、流式容器（Fluid containers）三种 -->
    <!-- 4.3 网格系统（grid）：
  Bootstrap的网格系统（栅格系统）使用一系列容器、行和列来布局和对齐内容。它是用flexbox构建的，并且是完全响应的。
  注意：Bootstrap的网格系统每行划分为12份。 -->
    <!-- 注意：
  1. row代表一行
  2.col-xx-份数比如col-md-3
  3.可以写多个类名，决定不同宽度下排列个数 -->
    <!-- 4.4 列对齐:
  可以参考官网：https://v5.bootcss.com/docs/layout/columns/
  比如水平对齐可以：justify-content-* -->
    <style>
      /* .container {
      background-color: pink;
    }

    .container-fluid {
      background-color: red;
    } */

      /* 在 1200像素以上，一行摆放 6个盒子
    在 992像素以上，摆放 4个 
    在768像素以上，摆放 3个盒子
    在 576像素以上，摆放2个盒子
    在 576像素以下，摆放1个盒子 */
      .item {
        background-color: pink;
        height: 200px;
      }

      .box {
        margin-top: 100px;
        height: 100px;
        background-color: pink;
      }

      .box .row {
        height: 100px;
      }

      .box .item {
        height: 30px;
        background-color: skyblue;
      }
    </style>
  </head>

  <body>
    <!-- <div class="container">123</div>
  <div class="container-fluid">456</div> -->
    <!-- 1. 先写容器盒子 -->
    <div class="container">
      <!-- 2. 在写行盒子 -->
      <div class="row">
        <!-- 3. 写列盒子 -->
        <div class="item col-xl-2 col-lg-3 col-md-4 col-sm-6">1</div>
        <div class="item col-xl-2 col-lg-3 col-md-4 col-sm-6">2</div>
        <div class="item col-xl-2 col-lg-3 col-md-4 col-sm-6">3</div>
        <div class="item col-xl-2 col-lg-3 col-md-4 col-sm-6">4</div>
        <div class="item col-xl-2 col-lg-3 col-md-4 col-sm-6">5</div>
        <div class="item col-xl-2 col-lg-3 col-md-4 col-sm-6">6</div>
      </div>
    </div>

    <!-- 列对齐 -->
    <div class="container box">
      <div class="row align-items-center justify-content-between">
        <div class="item col-xl-2">1</div>
        <div class="item col-xl-2">2</div>
      </div>
    </div>
    <script src="./bootstrap/bootstrap.min.js"></script>
  </body>
</html>
