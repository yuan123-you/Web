<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- transition完整写法：
    transition：过渡属性持续时间速度曲线延迟时间；
    transition:all 1s linear 1s;
    所有属性添加过渡效果，过渡持续1秒，匀速，延迟1秒执行 -->
    <style>
      div {
        width: 200px;
        height: 200px;
      }
      .box1 {
        background-color: pink;
        /* 过渡 */
        transition: all 1s linear 0.2s;
      }
      .box1:hover {
        /* 整体缩放1.5倍 */
        transform: scale(1.5);
      }
      .box2 {
        background-color: skyblue;
      }
    </style>
  </head>
  <body>
    <div class="box1"></div>
    <div class="box2"></div>
  </body>
</html>
