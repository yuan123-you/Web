<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- 语法：
    backface-visibility:hidden;
    控制元素背面的可见性（默认镜像显示），常用于隐
    藏背面（如扑克牌翻转效果） -->
    <style>
      .box {
        /* 子绝父相 */
        position: relative;
        width: 300px;
        height: 450px;
        border: 1px solid blue;
        margin: 100px auto;
      }
      .box > div {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: pink;
        text-align: center;
        font-size: 30px;
        color: #fff;
        line-height: 450px;
        transition: all 1s;
        /* 转到后面要隐藏盒子 */
        backface-visibility: hidden;
      }
      .box .front {
        /* 提高层级 */
        z-index: 2;
      }
      .box:hover .front {
        transform: rotateY(-180deg);
      }
      .box .back {
        background-color: skyblue;
        transform: rotateY(180deg);
      }
      .box:hover .back {
        transform: rotateY(0deg);
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="front">正面</div>
      <div class="back">背面</div>
    </div>
  </body>
</html>
