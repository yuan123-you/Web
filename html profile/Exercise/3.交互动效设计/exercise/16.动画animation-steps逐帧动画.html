<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- steps逐帧动画：
    速度曲线除了常见的linear、ease、cubic-bezier等，还包含steps()函数，steps()是CSs动画中用于控制动画
    分段执行的计时函数，它通过将动画分割为离散的步骤，实现类似传统帧动画（逐帧动画）的跳跃效果。
    语法：
    animation:move 1s steps(8) infinite;
    steps(步数)，步数为正整数。
    经常和背景图片（精灵图）来实现动画效果。 -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      /* 全屏 */
      html,
      body {
        width: 100%;
        height: 100%;
      }
      body {
        background: url(../img3/bg2.png) no-repeat center/cover;
        /* center/cover 水平居中，垂直居中，缩放 */
      }
      /* 定义动画 */
      @keyframes move {
        0% {
          background-position: 0 0;
        }
        100% {
          background-position: -13700px 0;
        }
      }
      .box {
        width: 548px;
        height: 513px;
        background-color: skyblue;
        margin: 200px;
        background: url(../img3/step.png) no-repeat;
        background-size: 13700px 513px;
        /* 背景图大小 */
        /* 使用动画 */
        animation: move 1s steps(25) infinite;
        /* steps(帧数/图片个数、播放次数) */
      }
    </style>
    <style></style>
  </head>
  <body>
    <div class="box"></div>
  </body>
</html>
