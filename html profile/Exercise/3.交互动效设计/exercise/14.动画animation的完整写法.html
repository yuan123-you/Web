<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- animation属性完整写法：
    animation：动画名称动画时长速度曲线延迟时间播放次数播放方向执行完毕状态；
    动画名称和动画时长是必写，其余可以省略，但是要保证书写顺序。
    动画属性要写到目标元素里面。
    animation:move 1s; -->
    <style>
      body {
        background-color: pink;
      }
      /* 定义动画 */
      @keyframes move {
        0% {
          transform: translate(0, 0);
          background-color: skyblue;
        }
        25% {
          transform: translate(300px, 0);
        }
        50% {
          transform: translate(300px, 300px);
          /* translate是依据元素的原始位置进行位移的 */
          background-color: green;
        }
        75% {
          transform: translate(0, 300px);
        }
        100% {
          transform: translate(0, 0);
          background-color: orange;
        }
      }
      .box {
        width: 100px;
        height: 100px;
        background-color: skyblue;
        /* 动画名称和动画时长必须写且顺序不能乱 */
        animation: move 4s linear infinite;
        /* linear匀速 infinite无限的 */
        /* 1.动画名称
        2.动画时长
        3.动画节奏函数(默认，可以不写)
        4.动画播放次数(默认，可以不写)
        5.动画播放方向(默认，可以不写)
        6.动画延迟时间(默认，可以不写)
        7.动画执行完毕状态(默认，可以不写) */
      }
      /* 定义动画 */
      @keyframes circle {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      /* 使用动画 */
      .circle {
        display: block;
        margin: 100px auto;
        /* 动画匀速且无限次播放 */
        animation: circle 2s linear infinite;
      }
      .circle:hover {
        /* 鼠标经过暂停动画，鼠标离开继续播放动画 */
        animation-play-state: paused;
        /* 不能写在animation里面，只能单独写 */
      }
      /* 定义动画 */
      @keyframes scrollTipMove {
        0% {
          transform: translateY(0);
        }
        100% {
          transform: translateY(16px);
        }
      }
      /* 使用动画 */
      .scrollTip {
        display: block;
        width: 40px;
        height: 50px;
        margin: 100px auto;
        /* alternate交替 */
        animation: scrollTipMove 1s linear infinite alternate;
      }
    </style>
  </head>
  <body>
    <div class="box"></div>
    <img src="../img3/circle.png" alt="" class="circle" />
    <img src="../img3/scrollTip.png" alt="" class="scrollTip" />
  </body>
</html>
