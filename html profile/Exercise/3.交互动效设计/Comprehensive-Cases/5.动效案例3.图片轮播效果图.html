<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: #ecf4ff;
      }
      .box {
        overflow: hidden;
        width: 1180px;
        margin: 100px auto;
        /* border: 2px solid red; */
      }
      .box:hover .scroll {
        /* 鼠标悬停box，scroll轮播图暂停滚动 */
        animation-play-state: paused;
      }
      .scroll img {
        width: 180px;
        height: 90px;
        border-radius: 6px;
      }
      .scroll {
        display: flex;
        /* 调用动画 */
        animation: move 20s linear infinite;
      }
      .scroll .ad1 {
        display: grid;
        grid-template-columns: repeat(6, 180px);
        grid-template-rows: repeat(4, 90px);
        /* 上下间隙16px，左右间隙20px */
        gap: 16px 20px;
        margin-right: 20px;
      }
      /* 定义动画 */
      @keyframes move {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-1200px);
        }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="scroll">
