<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
      }
      body {
        background: linear-gradient(
            190deg,
            rgb(67, 22, 219) 13.57%,
            rgb(144, 118, 231) 98.38%
          )
          no-repeat;
      }
      .box {
        position: relative;
        width: 674px;
        height: 500px;
        /* background-color: pink; */
        margin: 0 auto;
      }
      .card1 {
        background: radial-gradient(
          218.51% 281.09% at 100% 100%,
          rgba(253, 63, 51, 0.6) 0%,
          rgba(76, 0, 200, 0.6) 45.83%,
          rgba(76, 0, 200, 0.6) 100%
        );
        width: 183px;
        height: 120px;
        position: absolute;
        top: 150px;
        left: -37px;
        border-radius: 10px;
      }
      .card2 {
        background: linear-gradient(
          192.64deg,
          rgb(67, 22, 219) 12.72%,
          rgb(144, 118, 231) 54.49%,
          rgb(162, 238, 255) 100.01%
        );
        width: 183px;
        height: 120px;
        position: absolute;
        top: 150px;
        left: 176px;
        border-radius: 10px;
      }
      .card3 {
        background: rgba(23, 12, 61, 0.3);
        width: 701px;
        height: 428px;
        border-radius: 10px;
        position: absolute;
        top: 200px;
        left: 0px;
        backdrop-filter: blur(10px);
      }
      .card4 {
        background: rgba(23, 12, 61, 0.2);
        width: 400px;
        height: 273px;
        border-radius: 10px;
        position: absolute;
        top: 370px;
        left: 40px;
        backdrop-filter: blur(10px);
        box-shadow: rgba(255, 255, 255, 0.2) 0px 0px 0px 0.5px inset;
      }
      .card5 {
        background: rgba(23, 12, 61, 0.2);
        width: 414px;
        height: 273px;
        border-radius: 10px;
        position: absolute;
        top: 400px;
        left: 340px;
        backdrop-filter: blur(10px);
        box-shadow: rgba(255, 255, 255, 0.2) 0px 0px 0px 0.5px inset;
      }
      /* 核心代码 */
      /* 选择.box里所有的亲儿子 */
      .box > * {
        transform: rotateY(-20deg) rotateX(20deg);
        /* 倾斜 */
        /* transform: skewX(-8deg); */
        transition: all 2s cubic-bezier(0.075, 0.82, 0.165, 1);
      }
      /* 鼠标经过剥削，去掉子元素倾斜效果，移动位置 */
      .box:hover .card1 {
        transform: translate(-30px, -30px);
      }
      .box:hover .card2 {
        transform: translate(0, -30px);
      }
      .box:hover .card3 {
        transform: translate(0, 0);
      }
      .box:hover .card4 {
        transform: translate(-120px, 60px);
      }
      .box:hover .card5 {
        transform: translate(30px, 30px);
      }
      /* 核心：
1.多个元素，利用定位分别移动到目标位置。
2.元素开始是按照rotateXY拉伸（或者斜切也可以）
3.鼠标经过，每个盒子去掉倾斜效果，利用平移微调位置即可。
新知识：
backdrop-filter:blur(10px);
backdrop-filter滤镜函数对元素背后的内容（如背景图像、文本或其他元素
进行实时处理，而不会改变元素本身的样式。
通过blur)实现半透明背景的模糊效果，数值越大越模糊，比如毛玻璃效果 */
    </style>
  </head>
  <body>
    <div class="box">
      <div class="card1"><img src="../img3/card1.svg" alt="" /></div>
      <div class="card2"><img src="../img3/card2.svg" alt="" /></div>
      <div class="card3"><img src="../img3/card3.svg" alt="" /></div>
      <div class="card4"><img src="../img3/card4.svg" alt="" /></div>
      <div class="card5"><img src="../img3/card5.svg" alt="" /></div>
    </div>
  </body>
</html>
