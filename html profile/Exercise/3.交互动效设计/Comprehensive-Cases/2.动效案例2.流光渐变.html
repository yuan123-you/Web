<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background-color: #000;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      a {
        text-decoration: none;
        color: #fff;
      }
      .btn2 {
        /* 溢出隐藏 */
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        width: 300px;
        height: 200px;
        border: 1px solid #333;
        border-radius: 10px;
        margin: 50px;
        color: #fff;
        font-size: 24px;
        font-weight: bold;
        text-align: center;
        line-height: 200px;
      }
      /* 径向渐变的盒子 */
      .btn2::before {
        content: "";
        position: absolute;
        width: 500px;
        height: 500px;
        background-image: conic-gradient(
          transparent,
          transparent,
          transparent,
          #00ccff
        );
        /* 使用动画 */
        animation: rotate 1s linear infinite;
        z-index: -1;
        /* 新知识：
        inset:3px;
        针对于定位，写法更简单
        等价于 top:3px; left:3px right:3px;bottom:3px;
        z-index:-1；可以被标准流盒子压住。 */
      }
      /* 黑色遮挡的盒子 */
      .btn2::after {
        content: "";
        position: absolute;
        /* 离上下左右各3px */
        inset: 3px;
        background-color: #000;
        border-radius: 10px;
        z-index: -1;
      }
      /* 添加动画 */
      @keyframes rotate {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <!--方式2-->
    <div class="btn2">渐变边框</div>
  </body>
</html>
