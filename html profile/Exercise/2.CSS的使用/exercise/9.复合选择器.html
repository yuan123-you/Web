<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div span{
            /* 后代选择器 */
            color: red;
        }
        div>span
        {
            /* 自带选择器 */
            color:blue;
        }
        div,
        span,
        p{
            /* 并集选择器 */
            color:aqua;
        }
        .box{
            /* 类选择器 */
            font-size: 30px;
        }
        p.box{
            /* 交集选择器 */
            color: aquamarine;
        }
        a:hover{
            /* 伪类选择器 */
            color: orange;
        }
        .box:hover{
            /* 伪类选择器 */
            color:green;
        }
    </style>
</head>
<body>
    <span>span 标签</span>
    <div>
        <span>这是div的儿子span</span>
        <p><span>这是div的孙子span</span></p>
    </div>
    <P>ppppp</P>
    <span>span span span</span>
    <p class="box">测试交集选择器</p>
    <a href="#">超链接</a>
    <h1 class="box">h1标签</h1>
</body>
</html>
