<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .div1 {
        position: relative;
        background-color: pink;
        width: 300px;
        height: 300px;
      }
      .div2 {
        position: absolute;
        /* 语法： */
        /* position: absolute; */
        /* 设定元素为绝对定位 */
        /* 元素脱离正常流，不占据空间，其他元素按原布局排列 */
        /* 相对于最近的已定位祖先元素（position非static）移动位置。若都无定 */
        /* 位则相对于视口来定位。 */
        /* 可以通过top、bottom、left、right属性进行偏移。 */
        /* 优先级：若同时设置top和bottom，仅top生效；同理left覆盖right。 */
        top: 50px;
        left: 50px;
        background-color: skyblue;
        width: 150px;
        height: 150px;
      }
      .div3 {
        background-color: purple;
        width: 100px;
        height: 100px;
      }
    </style>
  </head>
  <body>
    <div class="div1">
      <div class="div2">2</div>
      <div class="div3">3</div>
    </div>
  </body>
</html>
