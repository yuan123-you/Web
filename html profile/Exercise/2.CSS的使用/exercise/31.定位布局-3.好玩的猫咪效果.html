<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../小兔鲜项目/css/base.css" />
    <style>
      .box {
        position: relative;
        overflow: hidden;
        /*溢出元素隐藏 */
        width: 1000px;
        margin: 100px auto;
      }
      .box::before,
      .box::after {
        /*属于行内元素，但是加了定位，则可以直接给宽度和高度*/
        position: absolute;
        left: 0;
        content: "";
        width: 100%;
        height: 100px;
        background-color: #fff;
        border-radius: 50%;
      }
      .box::before {
        top: -50px;
        content: "可爱的小猫咪，滚动鼠标滚轮可以查看哦~~~";
        /* 内容 */
        text-align: center;
        line-height: 140px;
        color: #000;
      }
      .box::after {
        bottom: -50px;
      }
      .box ul {
        display: flex;
        gap: 15px;
        overflow-x: scroll;
        /* 水平滚动条 */
        scrollbar-width: none;
        /* 隐藏滚动条 */
        scroll-behavior: smooth;
        /* 平滑滚动 */
      }
      /*让谷歌或者苹果浏览器隐藏滚动条*/
      .box ul::-webkit-scrollbar {
        display: none;
      }
      .box ul li {
        flex: 0 0 200px;
        /*不拉伸，不伸缩初始值设置为200px*/
      }
      .box ul li img {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <ul>
        <li><img src="../图片素材/img2/cat1.jpg" alt="" /></li>
        <li><img src="../图片素材/img2/cat2.jpg" alt="" /></li>
        <li><img src="../图片素材/img2/cat3.jpg" alt="" /></li>
        <li><img src="../图片素材/img2/cat4.jpg" alt="" /></li>
        <li><img src="../图片素材/img2/cat5.jpg" alt="" /></li>
        <li><img src="../图片素材/img2/cat6.jpg" alt="" /></li>
        <li><img src="../图片素材/img2/cat7.jpg" alt="" /></li>
        <li><img src="../图片素材/img2/cat8.jpeg" alt="" /></li>
        <li><img src="../图片素材/img2/cat9.jpeg" alt="" /></li>
        <li><img src="../图片素材/img2/cat10.jpeg" alt="" /></li>
        <li><img src="../图片素材/img2/cat11.jpeg" alt="" /></li>
        <li><img src="../图片素材/img2/cat12.jpeg" alt="" /></li>
      </ul>
    </div>

    <script>
      // 获取可滚动的容器
      const scrollContainer = document.querySelector(".box ul");
      //监听鼠标滚轮事件
      scrollContainer.addEventListener("wheel", (e) => {
        //阻止默认的垂直滚动行为
        e.preventDefault();
        //根据滚轮的垂直滚动量（deltaY）调整横向滚动量（scrollLeft）
        //乘以系数（如1.5）可调整滚动灵敏度
        scrollContainer.scrollLeft += e.deltaY * 2;
      });
    </script>
  </body>
</html>
