<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../图片素材/iconfont1/iconfont.css">
    <!-- 根据提供的压缩包，引入CSS文件(link方式） -->
    <style>
        /* 字体图标 iconfont~
        字体图标（IconFonts）是一种将图标以字体形式嵌入网页的技术，
        允许开发者像使用文字一样通过CSS控制图标的样式（如颜色、大小、阴影等） */
        .icon-good{
            font-size: 40px;
            color: skyblue;
        }
        /* 3.使用字体图标
        一般情况下，我们通过标签调用类名选择对应字体图标。
        根据实际需求，调整字体样式，比如颜色、大小、位置等 */
    </style>
</head>
<body>
    <span class="iconfont icon-good"></span>
    <i class="iconfont icon-xihuan"></i>
</body>
</html>
