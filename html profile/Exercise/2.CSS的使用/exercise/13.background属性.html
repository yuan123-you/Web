<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- 属性              作用                     常用值                     示例代码   
    background-color 设置元素背景颜色 颜色名称、十六进制、RGB、透明度   background-color: #f0f0f0;
    background-image 设置背景图片 url(image.jpg) background-image: url(bg.png);
    background-repeat 控制背景图片是否重复 repeat（默认）、no-repeat、repeat-x、repeat-y   background-repeat:no-repeat;
    background-position 定位背景图片位置 x y （如 center top， 或者px、%单位） background-position: center ;
    background-size 调整背景图片尺寸 默认auto、cover（覆盖）、contain（包含） 或者跟px、% background-size: cover;background-attachment 背景是否随页面滚动 scroll（默认 滚动的）、fixed(固定） background-attachment: fixed;  -->
    <style>
      div {
        width: 400px;
        height: 400px;
        background: pink url(./图片素材/QQ20250925-132144.png) no-repeat center
          bottom/cover;
      }
    </style>
  </head>
  <body>
    <div></div>
  </body>
</html>
