<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      /* 如何实现元素跨越多个网格单元？
        实现语法1:
        .跨列：grid-column：开始线编号/结束线编号；
        .跨行：grid-row：开始线编号/结束线编号；
        grid-column：1/3； 1/3表示从第1列到第3列
        grid-row:1/3； 1/3表示从第1行到第3行
        注意：
        该属性要加到项目（子元素）身上。
        实现语法2:
        .跨列：grid-column：开始线编号/span跨单元格数量
        .跨行：grid-row：开始线编号/span跨单元格数量；
        grid-column:1/span2;从1线开始，跨2个单元格
        grid-row：1/span2；从1线开始，跨2个单元格*/
      .box {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
        max-width: 1200px;
        margin: 100px auto;
        border: 1px solid #000;
      }
      .box .item {
        height: 100px;
        background-color: lightblue;
      }
      .box .item:first-child {
        /* 从1线开始，跨到第三线 */
        grid-column: 1 / 3;
        grid-row: 1 / 3;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
      <div class="item">4</div>
      <div class="item">5</div>
      <div class="item">6</div>
      <div class="item">7</div>
      <div class="item">8</div>
      <div class="item">9</div>
      <div class="item">10</div>
      <div class="item">11</div>
      <div class="item">12</div>
    </div>
  </body>
</html>
