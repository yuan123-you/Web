<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .div1{
            width: 160px;
            height: 160px;
            background-color: red;
            padding: 20px;
            /* 手动减去盒子撑大的部分 */
        }        
        .div2{
            width: 200px;
            height: 200px;
            background-color: pink;
            padding: 20px;
            box-sizing: border-box;
            /* 自动减去撑大的部分 */
        }
    </style>
</head>
<body>
    <div class="div1">div1标签</div>
    <div class="div2">div2标签</div>
</body>
</html>
