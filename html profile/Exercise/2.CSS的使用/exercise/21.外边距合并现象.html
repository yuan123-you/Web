<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 垂直方向的两个盒子，外边距会合并，使用更大的那一个 */
        .div1{
            width: 200px;
            height: 200px;
            background-color: pink;
            margin: 50px;
        }
        .div2{
            width: 200px;
            height: 200px;
            background-color: pink;
            margin: 30px;
        }
    </style>
</head>
<body>
    <div class="div1">one</div>
    <div class="div2">two</div>
</body>
</html>
