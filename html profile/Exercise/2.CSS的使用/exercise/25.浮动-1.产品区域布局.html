<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        li{
            list-style: none;
        }
        .product{
            /* 大盒子 */
            margin: 50px auto;
            width: 1226px;
            height: 628px;
            background-color: pink;
        }
        .product .left{
            /* 左边小盒子 */
            float: left;
            width: 234px;
            height: 628px;
            background-color: orange;
        }
        .product .right{
            /* 右边小盒子 */
            float: right;
            width: 978px;
            height: 628px;
            background-color: skyblue;
        }
        .product .right li{
            /* 右边8个小小盒子 */
            float: left;
            margin-right: 14px;
            margin-bottom: 14px;
            width: 234px;
            height: 300px;
            background-color: yellowgreen;
        }
        .product .right li:nth-child(4n){
            margin-right: 0;
            /* 第四个li和第八个li 去掉右侧的margin */
        }
        /* 细节：如果父级宽度不够，浮动的盒子会掉下来 */
    </style>
</head>
<body>
    <div class="product">
        <div class="left"></div>
        <div class="right">
            <ul>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
            </ul>
        </div>
    </div>
</body>
</html>
