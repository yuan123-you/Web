<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      li {
        list-style: none;
      }
      a {
        text-decoration: none;
      }
      .box {
        display: flex;
        flex-wrap: wrap;
        /* 强制换行 */
        width: 80%;
        border: 1px solid red;
        margin: 0 auto;
      }
      .box .box1 {
        flex: 1;
        /*  */
        width: 80px;
        height: 120px;
        background-color: pink;
        min-width: calc(16.66666667% - 16px);
        /* min-width 限制最小宽度 */
        /* calc() 计算 */
        max-width: calc(16.66666667% - 16px);
        /* max-width 限制最大宽度 */
        margin-left: 8px;
        margin-right: 8px;
        margin-bottom: 16px;
      }
      .footer {
        width: 80%;
        height: 120px;
        background-color: black;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="box1">1</div>
      <div class="box1">2</div>
      <div class="box1">3</div>
      <div class="box1">4</div>
      <div class="box1">5</div>
      <div class="box1">6</div>
      <div class="box1">7</div>
      <div class="box1">8</div>
      <div class="box1">9</div>
      <div class="box1">10</div>
      <div class="box1">11</div>
      <div class="box1">12</div>
      <div class="box1">13</div>
      <div class="box1">14</div>
    </div>
    <div class="footer"></div>
  </body>
</html>
