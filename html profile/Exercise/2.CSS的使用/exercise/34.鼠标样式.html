<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* 在CSS中，cursor属性用于控制鼠标指针在元素上的显示样式，通过改变光标形态可以向用户传递交互提示
（如“可点击”“不可选中”等），从而提升界面交互体验。 */
    </style>
  </head>
  <body>
    <ul>
      <li style="cursor: pointer">鼠标样式pointer</li>
      <li style="cursor: text">鼠标样式text</li>
      <li style="cursor: wait">鼠标样式wait</li>
      <li style="cursor: help">鼠标样式help</li>
      <li style="cursor: not-allowed">鼠标样式not-allowed</li>
      <li style="cursor: grab">鼠标样式grab</li>
      <li style="cursor: grabbing">鼠标样式grabbing</li>
      <li style="cursor: zoom-in">鼠标样式zoom-in</li>
      <li style="cursor: zoom-out">鼠标样式zoom-out</li>
      <li style="cursor: move">鼠标样式move</li>
      <li style="cursor: crosshair">鼠标样式crosshair</li>
      <li style="cursor: col-resize">鼠标样式col-resize</li>
      <li style="cursor: row-resize">鼠标样式row-resize</li>
      <li style="cursor: all-scroll">鼠标样式all-scroll</li>
      <li style="cursor: none; background-color: lightgray">鼠标样式none</li>
    </ul>
  </body>
</html>
