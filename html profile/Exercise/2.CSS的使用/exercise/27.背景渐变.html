<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
/* 在CSS中，可以通过linear-gradient（线性渐变）和radial-gradient（径向渐变）为元素添加渐变背景
文字背景线性渐变：
background: linear-gradient(to right,pink, red)；设置背景渐变
-webkit-background-clip:text;兼容性写法，照顾谷歌老版本浏览器-webkit-
background-clip: text; 文字范围裁剪背景
-webkit-text-fill-color: transparent; 文本填充颜色设置为透明 */
        .box{
            width: 240px;
            height: 100px;
            background: linear-gradient(to right,pink,orange);
            /*  */
        }
        .box1{
            margin-top: 30px;
            width: 240px;
            height: 100px;
            background: linear-gradient(240deg,pink,orange);
        }
        .text{
            font-size: 40px;
            font-weight: 700;
            background: linear-gradient(to right,pink, green);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .text1{
            font-size: 40px;
            font-weight: 700;
            background: linear-gradient(120deg,pink, green);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <div class="box"></div>
    <div class="box1"></div>
    <p class="text">我是渐变的文字</p>
    <p class="text1">我是渐变的文字</p>
</body>
</html>
