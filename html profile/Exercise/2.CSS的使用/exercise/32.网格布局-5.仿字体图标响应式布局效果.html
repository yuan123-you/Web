<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .box {
        display: grid;
        /* 自动填充，设置了最小值为210px */
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        /* 盒子最大宽度为1350px */
        max-width: 1350px;
        margin: 30px auto;
        gap: 20px;
      }
      .box video {
        width: 100%;
        height: 100%;
        border-radius: 18px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <video src="../图片素材/img2/video.mp4"></video>
      <video src="../图片素材/img2/video.mp4"></video>
      <video src="../图片素材/img2/video.mp4"></video>
      <video src="../图片素材/img2/video.mp4"></video>
      <video src="../图片素材/img2/video.mp4"></video>
      <video src="../图片素材/img2/video.mp4"></video>
      <video src="../图片素材/img2/video.mp4"></video>
      <video src="../图片素材/img2/video.mp4"></video>
      <video src="../图片素材/img2/video.mp4"></video>
      <video src="../图片素材/img2/video.mp4"></video>
      <video src="../图片素材/img2/video.mp4"></video>
      <video src="../图片素材/img2/video.mp4"></video>
      <video src="../图片素材/img2/video.mp4"></video>
    </div>
  </body>
</html>
