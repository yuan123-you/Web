<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .box {
        display: flex;
        flex-wrap: wrap;
        width: 80%;
        border: 1px solid red;
        margin: 20px auto;
      }
      .box .box1 {
        flex: 0 0 16.666666%;
        width: 80px;
        height: 120px;
        background-color: pink;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="box1">1</div>
      <div class="box1">2</div>
      <div class="box1">3</div>
      <div class="box1">4</div>
      <div class="box1">5</div>
      <div class="box1">6</div>
      <div class="box1">7</div>
      <div class="box1">8</div>
      <div class="box1">9</div>
      <div class="box1">10</div>
      <div class="box1">11</div>
      <div class="box1">12</div>
      <div class="box1">13</div>
      <div class="box1">14</div>
    </div>
  </body>
</html>
