<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            background-color: pink;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 20px;
            padding-right: 10px;
            width: 100px;
            height: 100px;
        }
        .div2{
            padding: 10px 20px 30px 40px;
            /* 盒子内边距 */
            width: 100px;
            height: 100px;
            background-color: pink;
        }
        .div3{
            padding: 20px 40px 20px;
            width: 100px;
            height: 100px;
            background-color: pink;
        }        
        .div4{
            padding: 40px 10px;
            width: 100px;
            height: 100px;
            background-color: pink;
        }
    </style>
</head>
<body>
    <div>div1标签</div>
    <div class="div2">div2标签</div>
    <div class="div3">div3标签</div>    
    <div class="div4">div4标签</div>

</body>
</html>
