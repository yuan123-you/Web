<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .div1{
            width: 200px;
            height: 200px;
            background-color: pink;
            border: 5px solid #000;
            margin: 30px;
        }
        .div2{
            width: 200px;
            height: 200px;
            background-color: pink;
            border: 5px dashed #000;
            margin: 30px;
        }        
        .div3{
            width: 200px;
            height: 200px;
            background-color: pink;
            border: 5px dotted #000;
            margin: 30px;
        }
    </style>
</head>
<body>
    <div class="div1">div1标签</div>
    <div class="div2">div2标签</div>
    <div class="div3">div3标签</div>
</body>
</html>
