    <meta charset="UTF-8" />

    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      li {
        list-style: none;
      }
      a {
        text-decoration: none;
      }
      .col-flex {
        display: flex;
        width: 1180px;
        margin: 20px auto;
        /* border: 1px solid red; */
        gap: 16px;
        /* 间距16像素 */
      }
      .col-flex .box {
        flex: 1;
      }
      .col-flex .box a {
        overflow: hidden;
        /* 溢出隐藏图片*/
        display: block;
        /* 设置成块级元素，可以调整宽高 */
        width: 100%;
        border-radius: 18px;
        margin-bottom: 15px;
      }
      .col-flex .box a img {
        width: 100%;
        /* display: block; */
        /* vertical-align: bottom; */
        vertical-align: middle;
        /* vertical-align: top; */
        /* 垂直对齐-解决图片底部空白缝隙问题
        基线：浏览器行内元素（行内块元素）排版中存在
        用于对齐的基线(baseline）
        图片默认和文字基线对齐
        解决方案：
        1.把图片转换为块级元素。
        2.设置图片对齐方式不是基线对齐即可。*/
      }
    </style>
  </head>
