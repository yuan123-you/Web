        .box .ul li{
            background-color: #f7f7f7;
            height: 32px;
            line-height: 32px;
            margin-left: 8px;
            margin-right: 8px;
            border-radius: 4px;
            /* 边框 */
            transition: all .5s;
            /* 增加过渡效果 */
        }
        .box .ul li:hover{
            background-color: #fff;
            /* 鼠标悬停背景颜色效果 */
        }
        .box .ul li a:hover{
            color: #ff5000;
            /* 鼠标悬停标签颜色效果 */
        }
        .box .ul li i{
            margin-right: 4px;
            /* 给i标签设置右外边距，更美观 */
        }
        .box .ul li:first-child,
        .box .ul li:first-child a

            color: #ff5000;
            /* 给li标签的第一列元素和标签设置颜色 */
