<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        display: inline-block;
        width: 100px;
        height: 100px;
        background-color: green;
        margin: 20px;
        line-height: 100px;
        text-align: center;
        float: left;
      }
      .div1 {
        border: 3px solid blue;
      }
      .div2 {
        border-radius: 50%;
        border: 3px dashed blue;
      }
      .div3 {
        border-top-left-radius: 20%;
        border-top-right-radius: 20%;
        border: 3px solid blue;
      }
      .div4 {
        border-radius: 25%;
        border: 3px solid blue;
      }
      .div5 {
        border-radius: 25%;
        border: 3px solid blue;
        border-bottom: 5px dotted red;
      }
    </style>
  </head>
  <body>
    <p>
      乡村振兴的五大振兴包括产业振兴、人才振兴、文化振兴、生态振兴和组织振兴
    </p>
    <div class="div1">产业振兴</div>
    <div class="div2">人才振兴</div>
    <div class="div3">文化振兴</div>
    <div class="div4">生态振兴</div>
    <div class="div5">组织振兴</div>
  </body>
</html>
