    <style>
        p{
        font-family: 'Noto Serif', serif; /* 使用有衬线字体*/
        font-size: 18px;
        /*设置字体大小*/
        color: #333;
        line-height: 1.6;
        text-align: justify;
        text-indent: 2em;
        letter-spacing: 1px;
        word-spacing: 2px;
        text-transform: capitalize;
        text-decoration: underline;
        }

<body>
<h2>关于工匠的英文句子:</h2>
<p class="craftsman-text">"A true craftsman pays attention to every detail,
ensuring that each piece is not just made, but crafted with precision and care."
</p>
<p class="craftsman-text">这句话翻译成中文是:“真正的工匠注重每一个细节，确保每一件作
品不仅被制作出来，而是以精确和关怀之心精工细作。”
这句话体现了工匠对于工作精益求精的态度，以及他们对待每件作品如同艺术品般的细心和专注。</p>
