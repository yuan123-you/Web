<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>清除浮动-clear</title>
<style>
.box1{
height:60px;
width:200px;
background-color:#1AF4F4;
float:left;/*左浮动*/
}
.box2{
height:60px;
width:200px;
background-color:#C5EAFC;
float:left;/*左浮动*/
clear: both;/*清除浮动*/
}
</style>
</head>
<body>
<div class="box1">做一个有尊严的人</div>
<div class="box2">做一个快乐的人</div>
<p>孩子，我要求你读书用功，不是因为我要你跟别人比成绩，而是因为，我希望你将来会拥有选择的
权利，选择有意义、有时间的工作，而不是被迫谋生。当你的工作在你心中有意义，你就有成就感。当
你的工作给你时间，不剥夺你的生活，你就有尊严。成就感和尊严，给你快乐。—龙应台《爱的安德烈》</p>
</body>
