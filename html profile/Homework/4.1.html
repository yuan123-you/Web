<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <style>
    h1{
        text-align: center;
        font-family: 新字体;
        font-weight: bold;
        color: red;
        font-size: 30px;
        text-shadow: 10px 10px 10px #f00;
    }
    h2{
        font-style: italic;
        font-weight: normal;
        font-size: 14px;
        text-align: right;
        text-decoration: underline;
    }
    p{
        font-family: 宋体;
        font-size: 15px;
        font-variant: small-caps;
        text-indent: 2em;
        line-height: 18px;
    }
    </style>
</head>
<body>
    <h1>一些成语</h1>
    <p>匠心独运：形容独特精巧的艺术构思。</p>
    <p>别具匠心：指在技巧和艺术方面具有与众不同的巧妙构思。</p>
    <h2>——————来自《百度汉语》</h2>
    <h1>一些英语</h1>
    <p>CUT OF A DIAMOND DEPENDS ON THE SKILL OF ITS CRAFISMAN.翻译：切割钻石的好坏取决于工匠的技艺。</p>
    <h2>——————来自《柯林斯英汉双解大辞典》</h2>
</body>
</html>
