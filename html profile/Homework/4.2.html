<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <style>
    h1{
        text-align: center;/*文字居中对齐*/
    text-shadow:10px 5px 10px green,20px 10px 20px blue;/*叠加绿色和蓝色*/
    }
    h2{
        text-align: center;/*文字居中对齐*/
    text-shadow:-10px -5px 10px green,-20px -10px 20px blue;/*叠加绿色和蓝色*/
    }
    p{
    font-family: xinziti;/*调用新字体*/
    font-size: 20px; /*字体大小*/
    text-indent: 2em; /*首行缩进*/
    line-height: 16px;/*行高*/
    text-align: center; /*文字居中对齐*/
    }
    </style>
</head>
<body>
    <h1>诗歌《工匠精神》</h1>
    <h2>(工匠精神)craftsman's spirit</h2>
<p>口口相传老孔嘉，经年磨砺自升华。</p>
<p>追求不惜时间久，严把当然品质葩。</p>
<p>完美收官人得意，海温馨结果梦无瑕。</p>
<p>细心雕琢由衷赞，工匠精神又被夸。</p>
</body>
</html>
