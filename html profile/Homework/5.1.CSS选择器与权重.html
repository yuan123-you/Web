<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      h2 {
        font-size: 40px;
      }
      .txt-red {
        color: red;
      }
      #txt-blue {
        color: blue;
      }
      p:first-child {
        font-style: italic;
      }
      p:last-child {
        background-color: green;
      }
    </style>
  </head>
  <body>
    <h2 class="txt-red">h2</h2>
    <h3 id="txt-blue">h2h2</h3>
    <p>p1</p>
    <p>p2</p>
    <p>p3</p>
    <p>p4</p>
  </body>
</html>
