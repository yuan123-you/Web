<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <style>
        body{
        background-image: url(bg3.jpg);/*背景图片*/
        background-repeat: repeat;/*背景图片重复*/
        }
        h1{
        background-color: #C9D3CB;/*背景颜色*/
        text-align: center; /*居中*/
        background-image: url("./图片素材/user2.png");
        background-repeat: no-repeat;/*背景图片不重复*/
        background-position: left center; /*背景图片位置*/
        background-size: 30px;/*背景图片大小*/
        }
        h2{
        background: url("./图片素材/txt1.png") no-repeat left bottom, url("./图片素材/txt2.png") no-repeat right bottom;
        background-size:200px;
        height: 100px;/*背景图片高度*/
        }
        p{
        text-indent: 2em; /*首行缩进2个字符*/
        line-height: 20px; /*行高*/
        }
        </style>
        </head>
        <body>
        <h1>大国工匠</h1>
        <p>“物勒工名，以考其诚。工有不当，必行其罪，以穷以情”。</p>
        <p> 这是《吕氏春秋》中的一段描述，意思是说，当时的工匠需要在负责制作的产品上勒刻下名字，这样如果产品有质量问题，就会被治罪。虽然这从某种程度上，体现出工匠律令严格，但也反映出当时的手工制作标准非常规范，工匠们的技术也十分过硬.</p>
        <h2></h2>
        </body>
        </html>
