<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <table border="4" bordercolor="gray" cellingspacing="1" align="center" width="500" height="300">
            <h1 style="text-align: center;">
                志愿活动征集表单
            </h1>
                <tr>
                    <td>志愿活动名称</td>
                    <td>
                        <input type="text">
                    </td>
                </tr>
                <tr>
                    <td>活动开展日期</td>
                    <td>
                        <input type="date">
                    </td>
                </tr>
                <tr>
                    <td>当天的开始时间</td>
                    <td>
                        <input type="time">
                    </td>
                </tr>
                <tr>
                    <td>当天的结束时间</td>
                    <td>
                        <input type="time">
                    </td>
                </tr>
                <tr>
                    <td>活动简介</td>
                    <td>
                        <textarea name="" id=""></textarea>
                    </td>
                </tr>
                <tr>
                    <td>征集人数</td>
                    <td>
                        <input type="text">
                    </td>
                </tr>
                <tr>
                    <td>联系人姓名</td>
                    <td>
                        <input type="text">
                    </td>
                </tr>
                <tr>
                    <td>联系人电话</td>
                    <td>
                        <input type="text">
                    </td>
                </tr>
                <tr>
                    <td>联系人邮箱</td>
                    <td>
                        <input type="text">
                    </td>
                </tr>
                <tr>
                    <td></td>
                    <td>
                        <button type="submit">提交</button>
                        <button type="reset">重置</button>
                    </td>
                </tr>
            </table>
    </form>
</body>
</html>
