<!DOCTYPE html>
  <html>
    <head>
      <meta charset="utf-8" />
      <title>盒子大小属性box-sizing</title>
      <style>
        .content-box {
          width: 400px;
          height: 100px;
          padding: 10px;
          border: 5px solid #999;
          box-sizing: content-box;
          margin: 5px;
        }
        .border-box {
          width: 400px;
          height: 100px;
          padding: 10px;
          border: 5px solid #999;
          box-sizing: border-box;
          margin: 5px;
        }
      </style>
    </head>
    <body>
      <div class="content-box">
        友谊是两颗心真诚相待，而不是一颗心对另一颗心的敲打。—鲁迅《鲁迅杂文选》
      </div>
      <div class="border-box">
        以清净心看世界，以欢喜心过生活，以平常心生情味，以柔软心除挂碍
        “—林清玄《人生最美是清欢》
      </div>
    </body>
  </html>
</doctype>
