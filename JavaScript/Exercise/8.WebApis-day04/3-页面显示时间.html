<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let date = new Date();
      let year = date.getFullYear();
      let month = date.getMonth() + 1;
      if (month < 10) {
        month = "0" + month;
      }
      let date_ = date.getDate();
      if (date_ < 10) {
        date_ = "0" + date_;
      }
      let hour = date.getHours();
      if (hour < 10) {
        hour = "0" + hour;
      }
      let min = date.getMinutes();
      if (min < 10) {
        min = "0" + min;
      }
      document.writeln(`${year}-${month}-${date_} ${hour}:${min}`);
    </script>
  </body>
</html>
