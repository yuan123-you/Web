<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .countdown {
        width: 240px;
        height: 305px;
        text-align: center;
        line-height: 1;
        color: #fff;
        background-color: brown;
        /* background-size: 240px; */
        /* float: left; */
        overflow: hidden;
      }

      .countdown .next {
        font-size: 16px;
        margin: 25px 0 14px;
      }

      .countdown .title {
        font-size: 33px;
      }

      .countdown .tips {
        margin-top: 80px;
        font-size: 23px;
      }

      .countdown small {
        font-size: 17px;
      }

      .countdown .clock {
        width: 142px;
        margin: 18px auto 0;
        overflow: hidden;
      }

      .countdown .clock span,
      .countdown .clock i {
        display: block;
        text-align: center;
        line-height: 34px;
        font-size: 23px;
        float: left;
      }

      .countdown .clock span {
        width: 34px;
        height: 34px;
        border-radius: 2px;
        background-color: #303430;
      }

      .countdown .clock i {
        width: 20px;
        font-style: normal;
      }
    </style>
  </head>

  <body>
    <div class="countdown">
      <p class="next">今天是2025年10月27日</p>
      <p class="title">放学倒计时</p>
      <p class="clock">
        <span id="hour"></span>
        <i>:</i>
        <span id="minutes"></span>
        <i>:</i>
        <span id="second"></span>
      </p>
      <p class="tips">17:55:00下课</p>
    </div>
    <script>
      // 获取今天的时间
      const today_date = new Date();
      const ty = today_date.getFullYear();
      const tm = today_date.getMonth() + 1;
      //月份要+1，是从0开始的，0-11月
      const td = today_date.getDate();
      //获取日期元素
      const d = document.querySelector(".next");
      //更新日期
      d.innerHTML = `今天是${ty}年${tm}月${td}日`;

      // 剩余时间函数
      function remainder() {
        //1.得到当前时间戳（单位是毫秒）
        let date = +new Date();
        // console.log(date);
        //2.得到将来时间戳
        let newDate = +new Date("2025-10-27 17:55:00");
        //3.用将来时间减去现在时间，得到剩余时间
        let remainderDate = newDate - date;
        //4.将时间戳转换成秒
        remainderDate /= 1000;
        // 5.将剩余时间转换成 天 时 分 秒
        let days = parseInt(remainderDate / 24 / 60 / 60);
        // console.log(days);
        let hours = parseInt((remainderDate / 60 / 60) % 24);
        if (hours < 10) {
          hours = "0" + hours;
        }
        // console.log(hours);
        let mins = parseInt((remainderDate / 60) % 60);
        // console.log(mins);
        if (mins < 10) {
          mins = "0" + mins;
        }
        let seconds = parseInt(remainderDate % 60);
        // console.log(seconds);
        if (seconds < 10) {
          seconds = "0" + seconds;
        }
        //6.获取时分秒元素
        const h = document.querySelector("#hour");
        const m = document.querySelector("#minutes");
        const s = document.querySelector("#second");
        h.innerHTML = hours;
        m.innerHTML = mins;
        s.innerHTML = seconds;
      }
      //调用剩余时间函数
      remainder();
      // 7.更新时钟，添加定时器
      let n = setInterval(remainder, 1000);
    </script>
  </body>
</html>
