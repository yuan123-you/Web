<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      //1.随机生成0-10的数字
      function random1(M, N) {
        return Math.floor(Math.random() * (N - M + 1) + M);
      }
      let random = random1(1, 10);
      // 2.用户输入猜数字
      while (true) {
        let num = Number(prompt("请输入一个数字："));
        if (num > random) {
          alert("猜大了！");
        } else if (num < random) {
          alert("猜小了！");
        } else {
          alert("猜对了！");
          break;
        }
      }
    </script>
  </body>
</html>
