<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- 1.2什么是DOM
  DOM（DocumentObjectModel—文档对象模型）是用来呈现以及与任意HTML或XML文档交互的API
  白话文：DOM是浏览器提供的一套专门用来操作网页内容的功能 
  DOM作用
开发网页内容特效和实现用户交互
DOM对象：浏览器根据html标签生成的JS对象
所有的标签属性都可以在这个对象上面找到
修改这个对象的属性会自动映射到标签身上-->
    <!-- DOM的核心思想
把网页内容当做对象来处理
document 对象
是DOM里提供的一个对象
所以它提供的属性和方法都是用来访问和操作网页内容的
例:document.write()
网页所有内容都在document里面 
参数:
包含一个或多个有效的CSS选择器字符串
返回值：
CSS选择器匹配的第一个元素，一个HTMLElement对象。
2.选择匹配的多个元素
语法:
document.querySelectorAll('css选择器'）
参数:
包含一个或多个有效的CSS选择器字符串
返回值：
CSS选择器匹配的NodeList对象集合
例如:
document.querySelectorAll('ul 1i')-->
  </head>

  <body>
    <div>123</div>
    <script>
      const div = document.querySelector("div");
      // 打印对象
      console.dir(div); // dom 对象
    </script>
  </body>
</html>
