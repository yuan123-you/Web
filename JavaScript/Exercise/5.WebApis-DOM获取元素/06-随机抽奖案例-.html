      //二.封装函数
      function choujiang() {
        //for循环实现
        //获取span里的所有元素
        const prize = document.querySelectorAll(".wrapper span");
        for (let i = 0; i < prize.length; i++) {
          const number = Math.floor(Math.random() * person.length);
          // 2.3 把名字给 prize[i]
          prize[i].innerHTML = person[number];
          // 2.4 删除数组这个名字
          person.splice(number, 1);
        }
      }
      choujiang();
