<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let i = 0;
      for (i = 1; i <= 3; i++) {
        document.write("月薪过万！<br>");
      }
      for (i = 1; i < 100; i++) {
        document.writeln(`${i}岁了`);
      }
      for (i = 0; i <= 100; i += 2) {
        document.writeln(i);
      }
    </script>
  </body>
</html>
