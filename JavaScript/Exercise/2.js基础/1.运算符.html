<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // 1.赋值运算符
      let num = 10;
      num += 5;
      num *= 5;
      console.log(num);
      console.log("-------------------------------------------------------");
      // 2.自增运算符
      let num1 = 1;
      console.log(++num1);
      num1 = 1;
      console.log(num1++);
      console.log("-------------------------------------------------------");
      //3.比较运算符
      console.log(3 > 5);
      console.log(3 >= 5);
      console.log(3 == 5);
      console.log(2 == 2);
      // == 双等号只判断值，不判断数据类型  比较运算符有隐式转换把'2’转换为2 双等号只判断值
      console.log(2 == "2");
      // === 三等号判断值和数据类型是否相等  开发中判断是否相等，强烈推荐使用===
      console.log(2 === "2");
      console.log(2 === 2);
      // NaN不等于任何人，包括它自己
      console.log(NaN === NaN);
      // !== 判断左右两边是否不全等
      console.log(3 !== "3");
      console.log("------------------------------------------------------");
      console.log("a" < "b"); //true
      console.log("aa" < "ab"); //true
      console.log("aa" < "aab"); //true
      console.log("-------------------------------------------------------");
      //4.逻辑运算符
      // 逻辑与 && 有假则假，全真为真
      console.log(true && true);
      console.log(true && false);
      console.log(false && false);
      console.log(3 < 5 && 7 > 6);
      console.log(3 < 5 && 7 > 10);
      console.log("-------------------------------------------------------");
      // 逻辑或|| 有真则真，全假为假
      console.log(true || true);
      console.log(true || false);
      console.log(false || false);
      console.log(3 < 5 || 1 > 100);
      console.log("-------------------------------------------------------");
      // 逻辑非 !
      console.log(!true);
      console.log(!false);
    </script>
  </body>
</html>
