<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        display: flex;
        /* 平均分布 */
        justify-content: space-around;
        align-items: flex-end;
        width: 800px;
        height: 400px;
        border-left: 2px solid #000;
        border-bottom: 2px solid #000;
        margin: 100px auto;
      }
      .box > div {
        display: flex;
        width: 60px;
        background-color: skyblue;
        text-align: center;
        font-weight: bold;
        justify-content: space-between;
        flex-direction: column;
      }
      .box div span {
        margin-top: -20px;
      }
      .box div h2 {
        margin-bottom: -35px;
        width: 70px;
        margin-left: -10px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <script>
      //四次弹窗效果
      let arr = [];
      for (let i = 1; i <= 4; i++) {
        //追加数据到数组 arr.push() 在数组末尾添加元素
        arr.push(prompt(`请输入第${i}季度数据：`));
      }
      //打印盒子开头
      document.write(`<div class="box">`);
      //打印盒子中间
      for (let j = 0; j < arr.length; j++) {
        document.write(`
        <div style="height: ${arr[j]}px" ;>
        <span>${arr[j]}</span>
        <h2>第${j + 1}季度</h2>
        </div>`);
      }
      //打印盒子结尾
      document.write(`</div>`);
    </script>
  </body>
</html>
