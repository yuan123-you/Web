<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let arr = [2, 4, 5, 8, 9];
      let sum = 0;
      let max = arr[0];
      let min = arr[0];
      for (let i = 0; i < arr.length; i++) {
        if (arr[i] > max) {
          max = arr[i];
        }
        if (arr[i] < min) {
          min = arr[i];
        }
        sum += arr[i];
      }
      document.writeln(`数组的和为：${sum}<br>`);
      document.writeln(`数组的平均值为：${sum / arr.length}<br>`);
      document.writeln(`数组的最大值为：${max}<br>`);
      document.writeln(`数组的最小值为：${min}`);
    </script>
  </body>
</html>
