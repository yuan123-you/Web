<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // 三元运算符
      // 条件 ? 代码1 : 代码2
      3 < 5 ? alert("真的") : alert("假的");
      //
      let num1 = prompt("请输入第一个数：");
      let num2 = prompt("请输入第二个数：");
      alert(`最大的数是${num1 > num2 ? num1 : num2}`);
    </script>
  </body>
</html>
