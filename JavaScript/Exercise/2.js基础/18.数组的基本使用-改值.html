<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let arr = ["pink", "red", "green"];
      //给所有元素后面加个老师
      for (let i = 0; i < arr.length; i++) {
        arr[i] += "老师";
        document.writeln(arr[i]);
        document.writeln("<br>");
      }
    </script>
  </body>
</html>
