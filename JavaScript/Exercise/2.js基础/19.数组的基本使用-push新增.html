<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=\, initial-scale=1.0" />
    <title>Document</title>
    <!-- 2.3 操作数组-新增
  目标：掌握利用push向数组添加元素（数据）
  数组.push）方法将一个或多个元素添加到数组的末尾，并返回该数组的新长度（重点）
  . -->
    <!-- arr.unshift（新增的内容）方法将一个或多个元素添加到数组的开头，并返回该数组的新长度
  语法:
  arr.unshift(元素1,
  元素n) -->
  </head>
  <body>
    <script>
      let arr = ["pink"];
      //arr.push 添加原元素到末尾
      arr.push("red", "blue", "yellow");
      document.writeln(arr);
      document.writeln("<br>");
      // arr.unshift 添加到开头
      arr.unshift("good", "move", "express");
      document.writeln(arr);
    </script>
  </body>
</html>
