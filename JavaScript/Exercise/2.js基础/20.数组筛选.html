<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- 2.3 操作数组-新增
    目标：掌握利用push向数组添加元素（数据）
    数组.push）方法将一个或多个元素添加到数组的末尾，并返回该数组的新长度（重点）
    . -->
  </head>
  <body>
    <script>
      let arr1 = [1, 999, 15, 165, 8, 34, 2, 5, 6, 7, 911, 4];
      let arr2 = [];
      // 选出大于10的数
      for (let i = 0; i < arr1.length; i++) {
        if (arr1[i] > 10) {
          arr2.push(arr1[i]);
        }
      }
      document.writeln(arr2);
      document.writeln("<br><br>");
      let arr3 = [1, 88, 0, 9, 0, 15, 0, 15, 8, 4, 0, 2, 5, 6, 7, 11, 4];
      let arr4 = [];
      // 选出大于不等于0的数
      for (let i = 0; i < arr3.length; i++) {
        if (arr3[i] !== 0) {
          arr4.push(arr3[i]);
        }
      }
      document.writeln(arr4);
    </script>
  </body>
</html>
