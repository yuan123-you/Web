<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <img src="./images/ad.png" alt="" />
    <script>
      //获取img元素
      const img = document.querySelector("img");
      //延迟函数-setTimeout
      setTimeout(function () {
        img.style.display = "none";
      }, 5000);
    </script>
  </body>
</html>
