<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>评论回车发布</title>
    <style>
      .wrapper {
        min-width: 400px;
        max-width: 800px;
        display: flex;
        justify-content: flex-end;
      }

      .avatar {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        overflow: hidden;
        background: url(./images/avatar.jpg) no-repeat center / cover;
        margin-right: 20px;
      }

      .wrapper textarea {
        outline: none;
        border-color: transparent;
        resize: none;
        background: #f5f5f5;
        border-radius: 4px;
        flex: 1;
        padding: 10px;
        /* 过渡 */
        transition: all 0.5s;
        height: 30px;
      }
      /* 获得焦点，文本域高度变为50px */
      .wrapper textarea:focus {
        border-color: #e4e4e4;
        background: #fff;
        height: 50px;
      }

      .wrapper button {
        background: #00aeec;
        color: #fff;
        border: none;
        border-radius: 4px;
        margin-left: 10px;
        width: 70px;
        cursor: pointer;
      }

      .wrapper .total {
        margin-right: 80px;
        color: #999;
        margin-top: 5px;
        /* 透明 */
        opacity: 0;
        transition: all 0.5s;
      }

      .list {
        min-width: 400px;
        max-width: 800px;
        display: flex;
      }

      .list .item {
        width: 100%;
        display: flex;
      }

      .list .item .info {
        flex: 1;
        border-bottom: 1px dashed #e4e4e4;
        padding-bottom: 10px;
      }

      .list .item p {
        margin: 0;
      }

      .list .item .name {
        color: #fb7299;
        font-size: 14px;
        font-weight: bold;
      }

      .list .item .text {
        color: #333;
        padding: 10px 0;
      }

      .list .item .time {
        color: #999;
        font-size: 12px;
      }
    </style>
  </head>

  <body>
    <div class="wrapper">
      <i class="avatar"></i>
      <textarea
        id="tx"
        placeholder="发一条友善的评论"
        rows="2"
        maxlength="200"
      ></textarea>
      <button>发布</button>
    </div>
    <div class="wrapper">
      <span class="total">0/200字</span>
    </div>
    <div class="list">
      <div class="item" style="display: none">
        <i class="avatar"></i>
        <div class="info">
          <p class="name">空城旧梦</p>
          <p class="text">
            大家都辛苦啦，感谢各位大大的努力，能圆满完成真是太好了[笑哭][支持]
          </p>
          <p class="time">2022-10-10 20:29:21</p>
        </div>
      </div>
    </div>
    <script>
      //获得元素
      const tx = document.querySelector(".wrapper #tx");
      const total = document.querySelector(".wrapper .total");
      const text = document.querySelector(".text");
      const item = document.querySelector(".item");
      //1.事件监听-获得焦点，文本域获得焦点时，把total的透明度设置为1（不透明）
      tx.addEventListener("focus", function () {
        total.style.opacity = 1;
      });
      //2.事件监听-失去焦点，文本域失去焦点时，把total的透明度设置为0（透明）
      tx.addEventListener("blur", function () {
        total.style.opacity = 0;
      });
      //3.检测用户输入，获取用户输入的字数
      tx.addEventListener("input", function () {
        //得到输入长度 tx.value.length
        //实时修改total显示的字数
        total.innerHTML = `${tx.value.length}/200字`;
      });
      //4.用户输入按下回车后发布评论
      tx.addEventListener("keyup", function (e) {
        // 只有按下的是回车键，才会触发
        if (e.key === "Enter") {
          // 判断输入内容是否为空，不等于空，才能发布评论
          if (tx.value.trim() !== "") {
            //转为块级元素，显示盒子评论
            item.style.display = "block";
            //把用户输入的内容放进去
            text.innerHTML = tx.value;
          }
          //按下回车后，清除文本域内容
          tx.value = "";
          //按下回车后，把字数统计复原为0
          total.innerHTML = "0/200字";
        }
      });
    </script>
  </body>
</html>
