<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        position: relative;
        margin: 100px auto;
        width: 500px;
        height: 250px;
        background-color: #7f7f7f;
      }
      p {
        font-size: 30px;
        text-align: center;
        padding: 10px 0;
      }
      .question {
        font-size: 20px;
        position: absolute;
        top: 80px;
        left: 20px;
      }
      .btn1 {
        position: absolute;
        bottom: 50px;
        left: 80px;
      }

      .btn2 {
        position: absolute;
        bottom: 50px;
        right: 80px;
      }
      button {
        font-size: 16px;
        padding: 5px 25px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <p>随机问答</p>
      <div class="question">问题是：</div>
      <button class="btn1">开始</button>
      <button class="btn2">结束</button>
    </div>
    <script>
      //创建初始数组
      const arr = [
        "问题是：不定积分是什么？",
        "问题是：中华人民共和国哪一年成立的？",
        "问题是：日本哪一年偷袭的珍珠港？",
        "问题是：deploy是什么意思？",
        "问题是：一年有多少天？",
        "问题是：1+1=?",
        "问题是：你多少岁了？",
      ];
      let count = 0;
      //获取问题元素
      const qs = document.querySelector(".question");
      //获取开始结束按钮
      const start = document.querySelector(".btn1");
      const end = document.querySelector(".btn2");
      //声明为全局变量s
      let n = 0;
      let random = 0;
      //定时器
      start.addEventListener("click", function () {
        n = setInterval(function () {
          //获取随机数
          random = Math.floor(Math.random() * arr.length);
          //更改问题元素
          qs.innerHTML = arr[random];
        }, 50);
        if (arr.length === 1) {
          start.disabled = true;
          end.disabled = true;
          clearInterval(n);
        }
      });
      end.addEventListener("click", function () {
        clearInterval(n);
        //删除数组元素
        arr.splice(random, 1);
      });
    </script>
  </body>
</html>
