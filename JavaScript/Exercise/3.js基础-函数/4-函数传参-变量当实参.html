<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function getSum(m = 0, n = 0) {
        let sum = 0;
        for (let i = m; i <= n; i++) {
          sum += i;
        }
        document.writeln(`${m}~${n}的和为${sum}<br>`);
      }
      let start = Number(prompt("请输入起始值："));
      let end = Number(prompt("请输入终止值："));
      getSum(start, end); //实参可以是变量  
    </script>
  </body>
</html>
