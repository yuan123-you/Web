<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- 函数名命名规范
  和变量命名基本一致
  尽量小驼峰式命名法
  前缀应该为动词
  命名建议：常用动词约定
  动词 含义
  can 判断是否可执行某个动作
  has 判断是否含义某个值
  is 判断是否为某个值
  get 获取某个值
  set 设置某个值
  load 加载某些数据 -->
  </head>
  <body>
    <script>
      //声明函数
      function getSum1() {
        let num1 = Number(prompt("请输入第一个数："));
        let num2 = Number(prompt("请输入第二个数："));
        document.writeln(`${num1}+${num2}=${num1 + num2}`);
      }
      //调用函数
      getSum1();
      document.writeln("<br>");
      //求0-100的和
      function getSum2() {
        let sum = 0;
        for (let i = 0; i <= 100; i++) {
          sum += i;
        }
        document.writeln(`0-100的和为：${sum}`);
      }
      getSum2();
    </script>
  </body>
</html>
