<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      //求最大值函数
      function getMax(num1 = 0, num2 = 0) {
        return num1 > num2 ? num1 : num2;
      }
      let max = getMax(10, 20);
      document.writeln(`最大值为:${max}<br>`);
      //求任意数组的最大值和最小值并返回
      function getArrMax(arr = []) {
        let max = arr[0];
        let min = arr[0];
        for (i = 1; i < arr.length; i++) {
          if (arr[i] > max) {
            max = arr[i];
          }
          if (arr[i] < min) {
            min = arr[i];
          }
        }
        return [max, min]; //返回值
      }
      let newArr = getArrMax([13, 5, 9, 7, 15, 17, 38, 10]);
      document.writeln(`数组的最大值为：${newArr[0]}<br>`);
      document.writeln(`数组的最小值为：${newArr[1]}`);
    </script>
  </body>
</html>
