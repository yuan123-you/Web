<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <script>
      //1. split 把字符串 转换为 数组  split("")引号里是什么符号就用什么符号分隔数组   和 join() 相反
      const str = "pink,red";
      const arr = str.split(",");
      console.log(arr);
      const str1 = "2022-4-8";
      const arr1 = str1.split("-");
      console.log(arr1);
      // 2. 字符串的截取   substring(开始的索引号[， 结束的索引号])
      // 2.1 如果省略 结束的索引号，默认取到最后
      // 2.2 结束的索引号不包含想要截取的部分
      const str3 = "今天是2025-11-2，努力学习前端中~";
      console.log(str3.substring(13));
      console.log(str3.substring(13, 17));
      // 3. startsWith 判断是不是以某个字符开头
      const str4 = "pink老师上课中";
      console.log(str4.startsWith("pink"));
      // 4. includes 判断某个字符是不是包含在一个字符串里面  区分大小写
      const str2 = "我是pink老师";
      console.log(str2.includes("pink")); // true
      console.log(str2.includes("Pink")); // false
    </script>
  </body>
</html>
