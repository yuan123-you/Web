<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- 4.数据类型
  JS数据类型整体分为两大类：
  基本数据类型
  number数字型
  string字符串型
  boolean布尔型
  4.1数据类型-布尔类型（boolean）
  表示肯定或否定时在计算机中对应的是布尔类型数据。
  它有两个固定的值true和false，表示肯定的数据用true（真），表示否定的数据用false（假）。
  undefined未定义型
  4.1数据类型-未定义类型（undefined）
未定义是比较特殊的类型，只有一个值undefined。
什么情况出现未定义类型？
只声明变量，不赋值的情况下，变量的默认值为undefined，一般很少【直接】为某个变量赋值为undefined。
  null空类型 
  引用数据类型
  object 对象-->
  </head>
  <body>
    <script>
      let num = 10;
      let str = "玉皇大帝";
      let bool = true;
      let un; //undefined
      let null1 = null;
      document.write(num, str, bool, un, null1);
      document.write(2 + 3);
      document.write(2 * 3);
      document.write(2 % 3);
      document.write(2 / 3);
    </script>
  </body>
</html>
