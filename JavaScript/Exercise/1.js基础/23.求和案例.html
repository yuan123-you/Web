<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // 用户输入 prompt得到是字符串类型 要转换为数字型
      let num1 = +prompt("请输入第一个数字");
      let num2 = +prompt("请输入第二个数字");
      alert(`总和为${num1 + num2}`);
    </script>
  </body>
</html>
