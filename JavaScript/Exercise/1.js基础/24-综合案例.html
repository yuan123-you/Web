<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      h2 {
        text-align: center;
      }
      table {
        /* 合并边框 */
        border-collapse: collapse;
      }
      table,
      th,
      td {
        border: 1px solid #000;
        margin: 0 auto;
        text-align: center;
      }
      th,
      td {
        padding: 10px 30px;
      }
    </style>
  </head>
  <body>
    <h2>订单确认</h2>
    <script>
      //1.定义变量
      let price = +prompt("请输入商品的价格：");
      let num = +prompt("请输入商品的数量：");
      let address = prompt("请输入收货地址：");
      // 2.计算总价
      let total = price * num;
      // 3.渲染页面 用模版字符串 外面要用反斜线包裹整串文字，里面用${变量名}
      document.write(`
        <table>
          <tr>
            <th>商品名称</th>
            <th>商品价格</th>
            <th>商品数量</th>
            <th>总价</th>
            <th>收货地址</th>
          </tr>
          <tr>
            <td>iQOO12</td>
            <td>${price}元</td>
            <td>${num}</td>
            <td>${total}元</td>
            <td>${address}</td>
          </tr>
        </table>
      `);
    </script>
  </body>
</html>
