<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 3.2控制台输出语句和检测数据类型
    2.通过typeof关键字检测数据类型
    typeof运算符可以返回被检测的数据类型。它支持两种语法形式：
    1.作为运算符：typeof x（常用的写法）
    2.函数形式：typeof(x)
    换言之，有括号和没有括号，得到的结果是一样的，所以我们直接使用运算符的写法。 -->
    <script>
      //typeof 变量名 检测数据类型
      let n = 10;
      document.write(typeof n);
      let str = "蔡徐坤";
      document.write(typeof str);
      let un;
      let bool = false;
      let null1 = null;
      document.write(typeof un);
      document.write(typeof bool);
      document.write(typeof null1);
    </script>
  </body>
</html>
