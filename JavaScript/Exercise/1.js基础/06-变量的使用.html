<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- 2.2变量的基本使用
  1.声明变量：
  要想使用变量，首先需要创建变量（也称为声明变量或者定义变量）
  语法：
  let 变量名 -->
    <!-- 举例：
  let age
  我们声明了一个age变量
  age即变量的名称，也叫标识符 -->
    <!-- 2.变量赋值
  定义了一个变量后，你就能够初始化它（赋值）。在变量名之后跟上一个“=”，然后是数值。 -->
  </head>
  <body>
    <script>
      let num = 20;
      let uname = "张三";
      console.log(num);
      console.log(uname);
    </script>
  </body>
</html>
