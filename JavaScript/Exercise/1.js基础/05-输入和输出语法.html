<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- 1.5JavaScript输入输出语法
  目标：能写出常见JavaScript输入输出语法
  输出和输入也可理解为人和计算机的交互，用户通过键盘、鼠标等向计算机输入信息，计算机处理后再展示结果给用户
  ，这便是一次输入和输出的过程。
  输出语法：
  语法1:
  document.write（'要出的内容'）
  作用：向body内输出内容
  注意：如果输出的内容写的是标签，也会被解析成网页元素 
  语法2:
  alert（'要出的内容'）
  作用：页面弹出警告对话框
  语法3:
  console.log（'控制台打印'）
  作用：控制台输出语法，程序员调试使用-->
    <!-- 2.输入语法：
  语法：
  prompt（'请输入您的姓名：'）
  作用：显示一个对话框，对话框中包含一条文字信息，用来提示用户输入文字 -->
  </head>
  <body>
    <script>
      // 输出
      document.write("我是div标签");
      document.write("<h1>我是标题</h1>");
      // 警告对话框
      alert("error");
      // 控制台输出
      console.log("i am a good student");
      // 输入对话框
      prompt("请输入你的姓名：");
      alert("hello,JS~");
      document.write("javascript我来了");
      console.log("它~会魔法吧");
    </script>
  </body>
</html>
