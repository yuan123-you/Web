<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let age = prompt("请输入你的年龄：");
      let name = prompt("请输入你的姓名：");
      // 模版字符串，外面要用反斜线包裹整串文字，里面用${变量名}；
      document.write(`我是${name},我今年${age}岁了！`);
    </script>
  </body>
</html>
