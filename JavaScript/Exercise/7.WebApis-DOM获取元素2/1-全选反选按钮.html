<!DOCTYPE html>

<html>
  <head lang="en">
    <meta charset="UTF-8" />
    <title></title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      table {
        border-collapse: collapse;
        border-spacing: 0;
        border: 1px solid #c0c0c0;
        width: 500px;
        margin: 100px auto;
        text-align: center;
      }

      th {
        background-color: #09c;
        font: bold 16px "微软雅黑";
        color: #fff;
        height: 24px;
      }

      td {
        border: 1px solid #d0d0d0;
        color: #404060;
        padding: 10px;
      }

      .allCheck {
        width: 80px;
      }
    </style>
  </head>

  <body>
    <table>
      <tr>
        <th class="allCheck">
          <input type="checkbox" name="" id="checkAll" />
          <span class="all">全选</span>
        </th>
        <th>商品</th>
        <th>商家</th>
        <th>价格</th>
      </tr>
      <tr>
        <td>
          <input type="checkbox" name="check" class="ck" />
        </td>
        <td>小米手机</td>
        <td>小米</td>
        <td>￥1999</td>
      </tr>
      <tr>
        <td>
          <input type="checkbox" name="check" class="ck" />
        </td>
        <td>小米净水器</td>
        <td>小米</td>
        <td>￥4999</td>
      </tr>
      <tr>
        <td>
          <input type="checkbox" name="check" class="ck" />
        </td>
        <td>小米电视</td>
        <td>小米</td>
        <td>￥5999</td>
      </tr>
    </table>
    <script>
      //获取元素
      const checkAll = document.querySelector("#checkAll");
      const cks = document.querySelectorAll(".ck");
      // 给全选按钮添加鼠标监听事件--点击
      checkAll.addEventListener("click", function () {
        // 点击全选---遍历所有的小多选框---把大全选框的checked属性给小多选框，要么全选，要么全不选
        // checked值为布尔型，true为选择，false为不选择
        for (let i = 0; i < cks.length; i++) {
          cks[i].checked = checkAll.checked;
        }
      });
      for (let j = 0; j < cks.length; j++) {
        // 5.1 给所有的小复选框添加点击事件
        cks[j].addEventListener("click", function () {
          // 判断选中的小复选框个数 是不是等于  总的小复选框个数
          // 一定要写到点击里面，因为每次要获得最新的个数
          checkAll.checked =
            document.querySelectorAll(".ck:checked").length === cks.length;
        });
      }
    </script>
  </body>
</html>
