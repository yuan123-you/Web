<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>认识Promise</title>
  </head>

  <body>
    <script>
      /**
       * 目标：使用Promise管理异步任务
       */
      // 1.窗机promise对象
      const p = new Promise((resolve, reject) => {
        // 2.执行异步代码
        //2.执行异步任务-并传递结果
        // 成功调用：resolve(值)触发 then()执行
        //失败调用：reject(值)触发catch()执行
        setTimeout(() => {
          // resolve("模拟成功！");
          reject(new Error("模拟失败"));
        }, 2000);
      });
      // 3.获取结果
      p.then((result) => {
        console.log(result);
      }).catch((error) => {
        console.log(error);
      });
    </script>
  </body>
</html>
