<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 创建Vue实例，初始化渲染 -->
    <!-- 1.准备容器（Vue所管理的范围） -->
    <!-- 2.引包（开发版本包/生产版本包）官网 -->
    <!-- 3.创建实例 -->
    <!-- 4.添加配置项=>完成渲染 -->
    <div class="box1">box1={{msg}}</div>
    <div class="box2">box2={{count}}</div>
    =====================================================================
    <div id="app">
      <!--这里将来会编写一些用于渲染的代码逻辑-->
      <!-- 语法 {{data数据项}} 并且可以被标签包裹 -->
      <h1>{{ msg }}</h1>
      <a href="#">{{ count }}</a>
    </div>
    <!-- 引入的是开发版本包·-包含完整的注释和警告·-->
    <script src="../vue.js"></script>

    <script>
      // 一旦引入了vueJs核心包，在全局环境中就有了vue构造函数
      const app = new Vue({
        // 通过el配置选择器，指定vue管理的是哪个盒子
        el: "#app",
        // 通过data提供数据
        data: {
          msg: "hello world",
          count: 6666,
        },
      });
    </script>
  </body>
</html>
